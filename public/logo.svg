<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lumen75: a keycap seen from the front, "75" cut out of its top, and one bar of light
       under it. Flat, three solid colours. -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#0f1115"/>

  <!-- keycap: the skirt as an outline, the top face solid -->
  <rect x="210" y="190" width="604" height="590" rx="118" fill="none" stroke="#f4f4f5" stroke-width="34"/>
  <rect x="270" y="236" width="484" height="430" rx="78" fill="#f4f4f5"/>

  <!-- "75" legend, in the tile colour -->
  <g fill="#0f1115" transform="translate(207.5 216.5) scale(0.46)">
    <path d="M360 232 h290 v112 l-154 448 h-136 l150 -440 h-150 z"/>
    <path d="M684 232 h280 v116 h-160 v74 h52 a185 185 0 0 1 0 370 h-172 v-116 h160 a69 69 0 0 0 0 -138 h-160 z"/>
  </g>

  <!-- the light -->
  <rect x="300" y="842" width="424" height="34" rx="17" fill="#ffb020"/>
</svg>
